[project]
name = "backup-sys"
version = "0.1.0"
description = "Sistema di backup automatico append-only per Windows 11"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - uso privato" }
dependencies = [
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "croniter>=2.0",
    "argon2-cffi>=23.1",
    "keyring>=25.0",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10.0; sys_platform == 'win32'",
]

[project.scripts]
backup-sys = "backupsys.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-croniter",
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backupsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["backupsys"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["backupsys.ui.*", "backupsys.cli", "backupsys.daemon"]
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["backupsys"]
branch = true
