name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run pyinstaller scripts/backup-sys.spec --noconfirm
      - name: Smoke test dell'eseguibile
        run: dist\backup-sys\backup-sys-cli.exe version
      - uses: actions/upload-artifact@v4
        with:
          name: backup-sys-windows
          path: dist/backup-sys
